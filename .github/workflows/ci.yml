name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline: compares vendor/design-tokens against its SHA256SUMS, no access to design-taste needed.
      - name: Design tokens drift check
        run: sh vendor/design-tokens/sync.sh --check

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Before the unit tests: tests/unit/measure.test.ts runs the measure tool in a real Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:ext
