<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>easeprint extension fixture</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  .card { display: block; width: 200px; padding: 20px; background: #eee; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; }
  .card:hover { transform: translateY(-4px); }
  .link { transition: opacity 200ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .link:hover { opacity: 0.6; }
  .menu { transition: transform 140ms cubic-bezier(0.4, 0, 1, 1); }
  .spinner { width: 20px; height: 20px; border: 2px solid; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  .js { width: 40px; height: 40px; background: #345; }
</style>
</head>
<body>
  <a class="card" href="#a">Card</a>
  <a class="card" href="#b">Card two</a>
  <p><a class="link" href="#c">Link</a> <a class="link" href="#d">Link</a></p>
  <div class="menu">Menu</div>
  <div class="spinner"></div>
  <div class="waapi">waapi</div>
  <div class="js" id="js"></div>
  <script>
    // A move driven from JavaScript: cubic-bezier(0.25, 0.1, 0.25, 1) over 500ms, written to inline style each frame.
    function bez(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (x) => { let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (sx(m) < x) lo = m; else hi = m; } return sy((lo + hi) / 2); };
    }
    window.runJs = () => {
      const el = document.getElementById('js'), f = bez(0.25, 0.1, 0.25, 1), t0 = performance.now();
      const tick = (now) => {
        const x = Math.min(1, (now - t0) / 500);
        el.style.transform = `translateX(${200 * f(x)}px)`;
        if (x < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    window.runWaapi = () => document.querySelector('.waapi').animate([{ transform: 'none' }, { transform: 'translateX(10px)' }], { duration: 640, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
  </script>
</body>
</html>
